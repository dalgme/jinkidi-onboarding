name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # RLS는 이 프로젝트에서 가장 위험한 부분이다.
      # 실제 Postgres에 마이그레이션을 적용하고 격리 테스트를 통과시킨다.
      - name: Install PostgreSQL client and server
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-contrib-16

      - name: Database migrations and RLS isolation tests
        run: ./scripts/verify-db.sh
        env:
          PGBIN: /usr/lib/postgresql/16/bin
          PGRUNAS: postgres

      - name: Build
        run: pnpm build
        env:
          # 빌드 시점에는 실제 연결이 필요 없다. 형식만 맞춘 더미 값을 쓴다.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
